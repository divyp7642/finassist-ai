
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finassist-postgres

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: finassist-postgres

  template:
    metadata:
      labels:
        app: finassist-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          env:
            - name: POSTGRES_USER
              value: "postgres"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finassist-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: "finassist_db"

            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: finassist-postgres-pvc
