
apiVersion: v1
kind: Service
metadata:
  name: finassist-kafka-service

spec:
  type: ClusterIP

  selector:
    app: finassist-kafka

  ports:
    - name: broker
      port: 9092
      targetPort: 9092
      protocol: TCP

    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP
